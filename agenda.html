<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#130f0a">
<link rel="manifest" href="manifest.json">
<title>Agenda — Barbearia Lourenço</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rye&family=Jost:ital,wght@0,400;0,500;0,600;0,700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#130f0a; --panel:#1e170f; --panel2:#251c12; --line:#3c2c1c; --rust:#b8692f; --gold:#c9a15a;
  --cream:#efe6d8; --muted:#a89484;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;}
body{margin:0; min-height:100vh; background:var(--bg); color:var(--cream); font-family:'Jost',Arial,sans-serif;}
h1,h2,h3{font-family:'Rye',Georgia,serif; font-weight:400; color:var(--gold); margin:0;}
.wrap{max-width:640px; margin:0 auto; padding:20px 16px calc(30px + env(safe-area-inset-bottom,0px));}
.btn{display:inline-block; border:1px solid var(--gold); color:var(--gold); background:transparent; padding:9px 16px; border-radius:4px; font-size:.85rem; cursor:pointer; font-family:'Jost',sans-serif;}
.btn.solid{background:var(--rust); border-color:var(--rust); color:var(--cream);}
.btn.full{width:100%;}

/* login (fallback, primeira vez no aparelho) */
#loginScreen{min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;}
.login-card{background:var(--panel); border:1px solid var(--line); border-radius:6px; padding:32px 28px; width:100%; max-width:320px; text-align:center;}
.login-card p{color:var(--muted); font-size:.85rem; margin:0 0 20px;}
.field{margin-bottom:12px; text-align:left;}
.field label{display:block; font-size:.76rem; color:var(--gold); margin-bottom:5px;}
.field input{width:100%; background:var(--bg); border:1px solid var(--line); color:var(--cream); padding:10px 12px; border-radius:4px; font-size:.92rem;}
.remember{display:flex; align-items:center; gap:8px; font-size:.78rem; color:var(--muted); margin:4px 0 16px;}
.err{color:#c96a5a; font-size:.8rem; min-height:1.1em; margin-top:8px;}
#bootScreen{min-height:100vh; display:flex; align-items:center; justify-content:center; color:var(--muted); font-size:.85rem;}

/* app */
#appScreen{display:none;}
header{display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; gap:10px;}
.today-btn{background:none; border:none; color:var(--gold); font-family:'Rye',serif; font-size:1.3rem; cursor:pointer; display:flex; align-items:center; gap:6px; padding:0;}
.today-btn .chev{font-size:.85rem; color:var(--muted); font-family:'Jost',sans-serif;}

/* faixa da semana */
.week-strip{display:flex; align-items:center; gap:4px; margin-bottom:16px;}
.week-strip > button{background:none; border:1px solid var(--line); color:var(--gold); width:26px; height:26px; border-radius:4px; cursor:pointer; flex-shrink:0; font-size:.9rem;}
.week-days{display:grid; grid-template-columns:repeat(7,1fr); gap:2px; flex:1;}
.week-day{display:flex; flex-direction:column; align-items:center; padding:4px 0; border-radius:6px; cursor:pointer; border:1px solid transparent;}
.week-day .dow{font-size:.6rem; color:var(--muted); text-transform:uppercase;}
.week-day .num{font-size:.85rem; margin-top:3px; width:24px; height:24px; display:flex; align-items:center; justify-content:center; border-radius:50%;}
.week-day.today .num{border:1px solid var(--gold);}
.week-day.selected .num{background:var(--rust); color:#fff;}
.week-day.closed{opacity:.35;}
.week-day .dotrow{display:flex; gap:2px; margin-top:3px; height:4px;}
.week-day .dotrow span{width:3px; height:3px; border-radius:50%; background:var(--gold);}

/* colunas dos barbeiros */
.day-columns{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
.col{min-width:0;}
.col-head{display:flex; align-items:center; gap:6px; margin-bottom:8px;}
.col-head .avatar{width:24px; height:24px; border-radius:50%; background:var(--panel2); display:flex; align-items:center; justify-content:center; font-size:.62rem; color:var(--gold); border:1px solid var(--line); flex-shrink:0;}
.col-head .name{font-size:.8rem; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.col-block-btn{width:100%; font-size:.68rem; padding:5px 6px; border-radius:14px; margin-bottom:10px;}
.col-block-btn.blocked{background:#c96a5a; border-color:#c96a5a; color:#fff;}
.appt{background:var(--panel2); border-left:3px solid var(--rust); border-radius:4px; padding:8px 9px; margin-bottom:8px; font-size:.78rem;}
.appt.done{opacity:.5; border-left-color:var(--muted);}
.appt .t{color:var(--gold); font-weight:600; font-size:.72rem;}
.appt .n{margin-top:2px; font-weight:600; font-size:.8rem;}
.appt .s{color:var(--muted); font-size:.72rem;}
.appt .p{color:var(--muted); font-size:.68rem; margin-top:2px;}
.appt .actions{display:flex; gap:5px; margin-top:6px; flex-wrap:wrap;}
.appt .actions button{font-size:.66rem; padding:3px 7px; border-radius:12px;}
.col-empty{color:var(--muted); font-size:.74rem; text-align:center; padding:18px 0;}
.col-closed{color:var(--muted); font-size:.78rem; text-align:center; padding:24px 0; border:1px dashed var(--line); border-radius:6px;}

/* seletor de mês (dialog) */
.cal-header{display:flex; align-items:center; justify-content:space-between; margin-bottom:12px;}
.cal-header button{background:none; border:1px solid var(--line); color:var(--gold); width:32px; height:32px; border-radius:4px; cursor:pointer; font-size:1rem;}
.cal-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:5px;}
.cal-dow{text-align:center; font-size:.68rem; color:var(--muted); padding-bottom:4px;}
.cal-day{aspect-ratio:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
  background:var(--panel); border:1px solid var(--line); border-radius:5px; font-size:.85rem; cursor:pointer; position:relative;}
.cal-day.closed{opacity:.35; cursor:default;}
.cal-day.empty-cell{visibility:hidden;}
.cal-day.today{border-color:var(--gold);}
.cal-day .dot{width:5px; height:5px; border-radius:50%; background:var(--rust); position:absolute; bottom:6px;}

dialog.day{background:var(--panel); color:var(--cream); border:1px solid var(--line); border-radius:6px;
  max-width:480px; width:94vw; padding:0; margin:auto; max-height:88vh;}
dialog.day::backdrop{background:rgba(0,0,0,.65);}
.day-inner{padding:22px 20px; max-height:88vh; overflow-y:auto;}
</style>
</head>
<body>

<div id="bootScreen">Carregando…</div>

<div id="loginScreen" style="display:none;">
  <div class="login-card">
    <h1>Agenda</h1>
    <p>Barbearia Lourenço — primeiro acesso deste aparelho</p>
    <form id="loginForm">
      <div class="field"><label>E-mail</label><input type="email" id="loginEmail" required></div>
      <div class="field"><label>Senha</label><input type="password" id="loginPass" required></div>
      <label class="remember"><input type="checkbox" id="rememberDevice" checked> lembrar neste aparelho</label>
      <button type="submit" class="btn solid full">Entrar</button>
      <p class="err" id="loginErr"></p>
    </form>
  </div>
</div>

<div id="appScreen">
  <div class="wrap">
    <header>
      <button class="today-btn" id="todayBtn"><span id="headerLabel">Hoje</span> <span class="chev">⌄</span></button>
      <button class="btn" id="logoutBtn">Sair</button>
    </header>
    <div class="week-strip">
      <button id="prevWeek">‹</button>
      <div class="week-days" id="weekDays"></div>
      <button id="nextWeek">›</button>
    </div>
    <div class="day-columns" id="dayColumns"></div>
  </div>
</div>

<dialog id="datePickerModal" class="day">
  <div class="day-inner">
    <div class="cal-header">
      <button id="prevMonth">‹</button>
      <h3 id="calTitle"></h3>
      <button id="nextMonth">›</button>
    </div>
    <div class="cal-grid" id="calGrid"></div>
    <button class="btn full" id="closeDatePicker" style="margin-top:16px;">Fechar</button>
  </div>
</dialog>

<script src="https://cdn.jsdelivr.net/npm/firebase@10.13.2/firebase-app-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/firebase@10.13.2/firebase-auth-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/firebase@10.13.2/firebase-firestore-compat.js"></script>
<script>
/* ⚠️ COLE AQUI o mesmo firebaseConfig do site principal / convite de aniversário */
var firebaseConfig = {
  apiKey: "AIzaSyD5iRGiwuiHZhZzBAdcjtQ4X-5sNJgkSe0", authDomain: "barbearia-ab315.firebaseapp.com", projectId: "barbearia-ab315",
  storageBucket: "barbearia-ab315.firebasestorage.app", messagingSenderId: "65589760855", appId: "1:65589760855:web:0c17763c26e4568589e412"
};
firebase.initializeApp(firebaseConfig);
var auth = firebase.auth();
var db = firebase.firestore();

var bootScreen = document.getElementById('bootScreen');
var loginScreen = document.getElementById('loginScreen');
var appScreen = document.getElementById('appScreen');
var allDocs = [];
var allBlocks = [];
var BARBERS = ["Rafael Marques","Diego Da Silva Lourenço"];
function barberSlug(name){ return name.indexOf('Rafael')===0 ? 'rafael' : 'diego'; }
function toIso(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
var todayIso = toIso(new Date());
var selectedDate = todayIso;
var pickerYear, pickerMonth;

/* --- login automático neste aparelho (sem precisar digitar toda vez) --- */
function tryAutoLogin(){
  var saved;
  try{ saved = JSON.parse(localStorage.getItem('lourenco_barber_login') || 'null'); }catch(e){ saved = null; }
  if(saved && saved.email && saved.pass){
    auth.signInWithEmailAndPassword(saved.email, saved.pass).catch(function(){
      try{ localStorage.removeItem('lourenco_barber_login'); }catch(e){}
      showLogin();
    });
  } else {
    showLogin();
  }
}
function showLogin(){ bootScreen.style.display = 'none'; loginScreen.style.display = 'flex'; }

auth.onAuthStateChanged(function(user){
  if(user){
    bootScreen.style.display = 'none'; loginScreen.style.display = 'none';
    appScreen.style.display = 'block';
    var now = new Date(); pickerYear = now.getFullYear(); pickerMonth = now.getMonth();
    listenAppointments();
  } else if(bootScreen.style.display !== 'none' || loginScreen.style.display === 'none'){
    appScreen.style.display = 'none';
    tryAutoLogin();
  }
});

document.getElementById('loginForm').addEventListener('submit', function(e){
  e.preventDefault();
  var email = document.getElementById('loginEmail').value;
  var pass = document.getElementById('loginPass').value;
  var remember = document.getElementById('rememberDevice').checked;
  document.getElementById('loginErr').textContent = '';
  auth.signInWithEmailAndPassword(email, pass).then(function(){
    if(remember){ try{ localStorage.setItem('lourenco_barber_login', JSON.stringify({email:email, pass:pass})); }catch(e){} }
  }).catch(function(){ document.getElementById('loginErr').textContent = 'E-mail ou senha incorretos.'; });
});
document.getElementById('logoutBtn').addEventListener('click', function(){
  try{ localStorage.removeItem('lourenco_barber_login'); }catch(e){}
  auth.signOut();
});

function listenAppointments(){
  db.collection('agendamentos').onSnapshot(function(snap){
    allDocs = snap.docs;
    renderAll();
  }, function(){
    document.getElementById('dayColumns').innerHTML = '<p style="grid-column:1/-1;color:var(--muted)">Não foi possível carregar a agenda. Verifique as regras do Firestore.</p>';
  });
  db.collection('bloqueios').onSnapshot(function(snap){
    allBlocks = snap.docs;
    renderAll();
  });
}
function docsForDateBarber(iso, barber){
  return allDocs.filter(function(d){ return d.data().date === iso && d.data().barber === barber; })
    .sort(function(a,b){ return a.data().time < b.data().time ? -1 : 1; });
}
function docsCountForDate(iso){
  return allDocs.filter(function(d){ return d.data().date === iso; }).length;
}
function isBlocked(iso, barber){
  return allBlocks.some(function(d){ return d.data().date === iso && d.data().barber === barber; });
}

var DOW_LETTERS = ['D','S','T','Q','Q','S','S'];
var MONTHS = ["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];

function renderAll(){
  renderHeader();
  renderWeekStrip();
  renderColumns();
}

function renderHeader(){
  var label;
  if(selectedDate === todayIso) label = 'Hoje';
  else {
    var p = selectedDate.split('-');
    label = p[2]+'/'+p[1]+'/'+p[0];
  }
  document.getElementById('headerLabel').textContent = label;
}

function renderWeekStrip(){
  var sel = new Date(selectedDate+'T12:00:00');
  var sunday = new Date(sel); sunday.setDate(sel.getDate() - sel.getDay());
  var html = '';
  for(var i=0;i<7;i++){
    var d = new Date(sunday); d.setDate(sunday.getDate()+i);
    var iso = toIso(d);
    var closed = (i===0 || i===1);
    var cls = 'week-day' + (iso===todayIso?' today':'') + (iso===selectedDate?' selected':'') + (closed?' closed':'');
    var hasAppt = docsCountForDate(iso) > 0;
    html += '<div class="'+cls+'" onclick="pickDate(\''+iso+'\')">'+
      '<span class="dow">'+DOW_LETTERS[i]+'</span>'+
      '<span class="num">'+d.getDate()+'</span>'+
      '<span class="dotrow">'+(hasAppt?'<span></span>':'')+'</span>'+
    '</div>';
  }
  document.getElementById('weekDays').innerHTML = html;
}
function pickDate(iso){ selectedDate = iso; renderAll(); }
document.getElementById('prevWeek').addEventListener('click', function(){
  var d = new Date(selectedDate+'T12:00:00'); d.setDate(d.getDate()-7); selectedDate = toIso(d); renderAll();
});
document.getElementById('nextWeek').addEventListener('click', function(){
  var d = new Date(selectedDate+'T12:00:00'); d.setDate(d.getDate()+7); selectedDate = toIso(d); renderAll();
});

function renderColumns(){
  var weekday = new Date(selectedDate+'T12:00:00').getDay();
  var closed = (weekday===0 || weekday===1);
  var html = BARBERS.map(function(barber){
    var initials = barber.split(' ').map(function(w){return w[0];}).slice(0,2).join('');
    var firstName = barber.split(' ')[0];
    if(closed){
      return '<div class="col"><div class="col-head"><span class="avatar">'+initials+'</span><span class="name">'+firstName+'</span></div>'+
        '<div class="col-closed">Fechado</div></div>';
    }
    var blocked = isBlocked(selectedDate, barber);
    var appts = docsForDateBarber(selectedDate, barber);
    var apptsHtml = appts.length ? appts.map(function(d){
      var a = d.data();
      var doneClass = a.status==='concluido' ? ' done' : '';
      return '<div class="appt'+doneClass+'">'+
        '<div class="t">'+a.time+'</div>'+
        '<div class="n">'+a.name+'</div>'+
        '<div class="s">'+a.service+'</div>'+
        '<div class="p">📞 '+a.phone+'</div>'+
        '<div class="actions">'+
          (a.status!=='concluido' ? '<button class="btn" onclick="markDone(\''+d.id+'\')">Concluir</button>' : '')+
          '<button class="btn" onclick="cancelBooking(\''+d.id+'\')">Cancelar</button>'+
        '</div>'+
      '</div>';
    }).join('') : '<div class="col-empty">Nenhum agendamento</div>';
    return '<div class="col"><div class="col-head"><span class="avatar">'+initials+'</span><span class="name">'+firstName+'</span></div>'+
      '<button class="btn col-block-btn'+(blocked?' blocked':'')+'" onclick="toggleBlock(\''+selectedDate+'\',\''+barber+'\')">'+
      (blocked?'Bloqueado — liberar':'Bloquear este dia')+'</button>'+
      apptsHtml+
    '</div>';
  }).join('');
  document.getElementById('dayColumns').innerHTML = html;
}

function toggleBlock(iso, barber){
  var id = iso + '_' + barberSlug(barber);
  var ref = db.collection('bloqueios').doc(id);
  if(isBlocked(iso, barber)){
    ref.delete();
  } else {
    var temAgendamento = allDocs.some(function(d){ return d.data().date===iso && d.data().barber===barber; });
    if(temAgendamento && !confirm('Já existe agendamento desse barbeiro nesse dia. Bloquear mesmo assim? (os agendamentos não são cancelados automaticamente)')) return;
    ref.set({date: iso, barber: barber, blocked: true, createdAt: firebase.firestore.FieldValue.serverTimestamp()});
  }
}
function markDone(id){ db.collection('agendamentos').doc(id).update({status:'concluido'}); }
function cancelBooking(id){ if(confirm('Cancelar este agendamento?')) db.collection('agendamentos').doc(id).delete(); }

/* --- seletor de data (dialog com mês inteiro) --- */
var datePickerModal = document.getElementById('datePickerModal');
document.getElementById('todayBtn').addEventListener('click', function(){
  var d = new Date(selectedDate+'T12:00:00');
  pickerYear = d.getFullYear(); pickerMonth = d.getMonth();
  renderPickerCalendar();
  datePickerModal.showModal();
});
document.getElementById('closeDatePicker').addEventListener('click', function(){ datePickerModal.close(); });
document.getElementById('prevMonth').addEventListener('click', function(){
  pickerMonth--; if(pickerMonth<0){pickerMonth=11; pickerYear--;} renderPickerCalendar();
});
document.getElementById('nextMonth').addEventListener('click', function(){
  pickerMonth++; if(pickerMonth>11){pickerMonth=0; pickerYear++;} renderPickerCalendar();
});
function renderPickerCalendar(){
  document.getElementById('calTitle').textContent = MONTHS[pickerMonth] + ' ' + pickerYear;
  var grid = document.getElementById('calGrid');
  var html = DOW_LETTERS.map(function(d){ return '<div class="cal-dow">'+d+'</div>'; }).join('');
  var first = new Date(pickerYear, pickerMonth, 1);
  var startOffset = first.getDay();
  var daysInMonth = new Date(pickerYear, pickerMonth+1, 0).getDate();
  for(var i=0;i<startOffset;i++){ html += '<div class="cal-day empty-cell"></div>'; }
  for(var day=1; day<=daysInMonth; day++){
    var dateObj = new Date(pickerYear, pickerMonth, day);
    var iso = toIso(dateObj);
    var weekday = dateObj.getDay();
    var closed = (weekday===0 || weekday===1);
    var count = docsCountForDate(iso);
    var cls = 'cal-day' + (closed?' closed':'') + (iso===todayIso?' today':'');
    html += '<div class="'+cls+'" onclick="pickDateFromPicker(\''+iso+'\')">'+day+(count?'<span class="dot"></span>':'')+'</div>';
  }
  grid.innerHTML = html;
}
function pickDateFromPicker(iso){
  selectedDate = iso;
  renderAll();
  datePickerModal.close();
}

tryAutoLogin();

if('serviceWorker' in navigator){
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('sw.js').catch(function(){ /* offline cache é opcional */ });
  });
}
</script>
</body>
</html>
